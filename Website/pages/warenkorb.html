<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dein Warenkorb | Gems</title>
    <!-- Lädt deine globale CSS für Header/Footer/Hintergrund -->
    <link rel="stylesheet" href="../style.css">
    <link rel="icon" type="image/png" href="../img/favicon.png">
</head>
<body>

    <!-- Header / Menüleiste -->
    <header class="header">
        <img src="../img/favicon.png" class="logo" alt="Gems Logo">
        
        <nav>
            <a href="../index.html">Home</a>
            <a href="./shop.html">Shop</a>
            <a href="./ueber-uns.html">Über uns</a>
            <a href="./kontakt.html">Kontakt</a>
        </nav>

        <p id="name">Gems</p>

        <!-- Rechter Bereich für Icons -->
        <div class="header-right">
            <div class="social-icons">
                <a href="https://instagram.com" target="_blank" rel="noopener" aria-label="Instagram">
                    <svg class="social-icon" xmlns="http://w3.org" viewBox="0 0 24 24" fill="none" stroke="#4a3b35" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <rect x="2" y="2" width="20" height="20" rx="5" ry="5"></rect>
                        <path d="M16 11.37A4 4 0 1 1 12.63 8 4 4 0 0 1 16 11.37z"></path>
                        <line x1="17.5" y1="6.5" x2="17.51" y2="6.5"></line>
                    </svg>
                </a>
                <a href="https://tiktok.com" target="_blank" rel="noopener" aria-label="TikTok">
                    <svg class="social-icon" xmlns="http://w3.org" viewBox="0 0 24 24" fill="none" stroke="#4a3b35" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M9 12a4 4 0 1 0 4 4V4a5 5 0 0 0 5 5"></path>
                    </svg>
                </a>
            </div>

            <!-- Warenkorb Button -->
            <a href="warenkorb.html" class="cart-btn" aria-label="Warenkorb">
                <svg class="cart-icon" xmlns="http://w3.org" viewBox="0 0 24 24" fill="none" stroke="#4a3b35" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M6 2L3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4z"></path>
                    <line x1="3" y1="6" x2="21" y2="6"></line>
                    <path d="M16 10a4 4 0 0 1-8 0"></path>
                </svg>
                <span class="cart-badge">0</span>
            </a>
        </div>
    </header>

    <!-- Hauptinhalt des Warenkorbs -->
    <main class="contact-main" style="max-width: 800px;">
        <h1 class="contact-title">Dein Warenkorb</h1>
        
        <!-- WICHTIG: In diesen Container baut cart.js deine Produkte und die Summe ein -->
        <div id="cart-container" style="background: #f8eee3; padding: 40px; border-radius: 15px; box-shadow: 0 4px 10px rgba(0,0,0,0.05);">
            <p style="color: #4a3b35; text-align: center; font-size: 1.2rem; font-style: italic;">
                Warenkorb wird geladen...
            </p>
        </div>
    </main>

    <!-- Footer -->
    <footer>
        <div class="footer-links">
            <a href="#">Impressum</a>
            <a href="#">Datenschutz</a>
            <a href="#">AGB</a>
        </div>
        <p>&copy; 2026 Gems Schmuck. Alle Rechte vorbehalten.</p>
    </footer>

    <!-- Bindet deine Warenkorb-Logik ein (Liegt im selben Ordner 'pages') -->
    <script src="cart.js"></script>
</body>
</html>
