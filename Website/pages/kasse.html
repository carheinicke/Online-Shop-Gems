<!--Reines HTML & CSS (Ohne JavaScript)Du kannst Filter komplett ohne Programmierlogik bauen, indem du CSS-Techniken wie das :checked-Attribut von Checkboxen oder Radio-Buttons nutzt.Wie es funktioniert: Jedes Produkt bekommt im HTML bestimmte Klassen (z. B. class="produkt ring" oder class="produkt silber"). Wenn ein Kunde auf den Filter „Ringe“ klickt, blendet das CSS über Selektoren alle Elemente aus, die diese Klasse nicht haben.Vorteil: Extrem schnell, unkompliziert zu schreiben und du musst keine neue Sprache lernen.Nachteil: Bei sehr vielen Produkten (über 50–100) wird der HTML-Code irgendwann unübersichtlich.-->
